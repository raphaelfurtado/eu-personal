<svg xmlns="http://www.w3.org/2000/svg" width="380" height="760" viewBox="0 0 380 760" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="380" height="760" fill="#e9e2d9"/>
  <!-- header -->
  <rect width="380" height="68" fill="#128c7e"/>
  <path d="M22 34l12-11v22z" fill="#fff"/>
  <circle cx="58" cy="34" r="17" fill="#ffffff" opacity="0.35"/>
  <text x="86" y="30" fill="#ffffff" font-size="16" font-weight="700">Izabel M. · aluna</text>
  <text x="86" y="48" fill="#cdeee7" font-size="12">online</text>
  <!-- incoming bubble (long testimonial) -->
  <g>
    <rect x="18" y="92" width="312" height="280" rx="12" fill="#ffffff"/>
    <text x="34" y="120" fill="#1b2520" font-size="14">Boa tarde, Marina! Tudo bem?</text>
    <text x="34" y="148" fill="#1b2520" font-size="14">Estou muito agradecida pelos</text>
    <text x="34" y="168" fill="#1b2520" font-size="14">resultados que alcançamos, com</text>
    <text x="34" y="188" fill="#1b2520" font-size="14">a sua dedicação e atenção. O treino</text>
    <text x="34" y="208" fill="#1b2520" font-size="14">é totalmente individualizado.</text>
    <text x="34" y="236" fill="#1b2520" font-size="14">Em um ano recuperei meu</text>
    <text x="34" y="256" fill="#1b2520" font-size="14">condicionamento e ganhei definição</text>
    <text x="34" y="276" fill="#1b2520" font-size="14">muscular — estou orgulhosa dessa</text>
    <text x="34" y="296" fill="#1b2520" font-size="14">conquista.</text>
    <text x="34" y="324" fill="#1b2520" font-size="15" font-weight="700">Muito obrigada! ❤️</text>
    <text x="300" y="356" fill="#8a9690" font-size="11">20:55</text>
  </g>
  <!-- outgoing bubble -->
  <g>
    <rect x="118" y="384" width="244" height="56" rx="12" fill="#dcf8c6"/>
    <text x="134" y="412" fill="#1b2520" font-size="14">Você merece, Izabel! Foi você</text>
    <text x="134" y="430" fill="#1b2520" font-size="14">que fez acontecer 👏✨</text>
    <text x="332" y="432" fill="#7da98c" font-size="11">21:03</text>
  </g>
